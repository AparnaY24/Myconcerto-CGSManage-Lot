<!DOCTYPE html>
<!-- ============================================================
     REIMAGINE REPORT - BLANK UI TEMPLATE v4.7
     v4.7 FIX: Business Context card now renders current_process_overview.business_context
          (v4.6 ignored it and printed a hard-coded sentence). Fallback text kept when empty.
     v4.6 UI CHANGES (swimlane connector routing - DATA CONTRACT unchanged):
       - Replaces the fixed-corridor router with a collision-aware orthogonal
         router. Each connector is selected from straight, L, Z (column gutter),
         Z (lane channel) and 5-leg detour candidates and scored against padded
         task boxes, gateways, events, gateway/event captions, placed connector
         labels and every previously routed segment.
       - A connector never re-uses an occupied segment, never passes through a
         node and never doubles back on itself; when a gutter or channel is full
         the router moves to the next free gutter or channel instead of
         compressing lines together.
       - Port slots fan multiple connectors that share a box side.
       - Connector labels are placed on a free stretch of their own route and
         become obstacles for later connectors.
       - Flow-order column normalization: every non-loop connection is forced to
         move strictly left-to-right. Only loop / rework edges (DFS back-edges)
         may run backward. Columns copied from an image's visual x-position that
         would create backward or same-column hops are pushed right.
       - Normalization works on a copy of the elements; REPORT_JSON is not
         modified. Routes are cached per diagram geometry so the As-Is, To-Be and
         compare views draw identical connector paths.
       - No HTML structure, CSS, tabs, columns, legends, filters, aliases, JSON
         keys or CSV layout changed.
     v4.5 UI CHANGES (rationale validation):  
       - Detects rationale text reused across different task/solution pairs.  
       - Repeated or known generic rationale is not presented as valid task-specific evidence.  
       - Solutions Discovery, CSV export, and enabler details show a task-specific validation message instructing regeneration of REPORT_JSON.  
       - Valid task-specific rationale remains unchanged.  
     v4.4 UI CHANGES (counter logic only - report layout unchanged):
       - Solutions Discovery counts every Whitespace task separately, even when
         multiple tasks use the same Whitespace or Custom build placeholder name.
       - Non-Whitespace category counters continue to de-duplicate repeated solution
         names case-insensitively within each category.
       - No HTML structure, CSS, tabs, columns, legends, filters, aliases, or CSV layout changed.
     v4.3 UI CHANGES (governed template enhancement):
       - Process KPIs displays literal source-provided KPI or outcome names in one KPI column.
       - Benchmark and Source columns are removed from the enabler-detail and Overall Summary KPI tables.
       - KPI badges display KPI names only; benchmark and source suffixes are suppressed.
       - mapping.kpis uses [{name}]. Older benchmark and source properties are ignored when present.
       - The empty state reads "No source-provided KPIs are available for this enabler."
     v4.2 UI CHANGES (governed template enhancement - DATA CONTRACT unchanged):
       - Baseline: supersedes the supplied v4.0 file and consolidates the Proposed Solutions
         Whitespace suppression already required by Generation Rules v1.8-v1.9 (v4.1 behaviour).
       - Proposed Solutions adds a category filter (chip group) inside the solutions panel with
         exactly these options: All, CGS Solution, Accenture Gen AI, BPA Bots, SAP Business AI.
       - Default category is All. JSON category values are unchanged; "CGS Scenarios" is only
         displayed as "CGS Solution".
       - Combined filtering: a card is visible only when it matches BOTH the current tree scope
         (hierarchy level = all tasks, or the selected task) AND the selected category.
       - Selecting a category never changes the selected task, the hierarchy expansion state or
         the tree selection. Selecting a task or the final hierarchy level never changes the
         selected category.
       - Clicking the final hierarchy level clears the task scope only (category is kept).
       - New "Show all solutions" button clears both the task scope and the category (back to All).
       - Visible total and every category count are computed from the same de-duplicated set
         (key = category | name | type | product) inside the current tree scope, so
         All count = sum of category counts = visible total when All is selected, and
         visible total = that category's count when a category is selected.
       - Custom build / Whitespace cards are not rendered in Proposed Solutions; Whitespace-only
         tasks remain selectable, show a count of 0 and a neutral no-qualified-solutions message.
       - Non-demo Accenture Gen AI mappings remain excluded (visibleMappings demo gate).
       - Accessibility: chip group has role="group" and an aria-label; chips are native buttons
         with aria-pressed; the total is an aria-live="polite" region; the empty state uses
         role="status"; task rows are keyboard-focusable (Enter/Space) with aria-pressed; level
         toggles expose aria-expanded; visible focus outlines are provided.
       - No new top-level JSON key: every mapping already carries its category.
     v4.0 UI CHANGES:
       - Reimagined Process Flow adds a Proposed Solutions section immediately above Reimagined Business Process Elements.
       - The section contains a clickable, expandable hierarchy side panel derived from meta.bph_path.
       - Clicking the final hierarchy level expands or collapses the task split and simultaneously restores all proposed solutions.
       - Clicking an individual task shows only the proposed solutions mapped to that task.
       - The solutions area shows solution cards only; task names and roles are not repeated in the card grid.
       - Proposed solutions are de-duplicated in the all-solutions view.
       - A task with no qualified solution displays Custom build with category Whitespace. (Superseded in v4.2: no Whitespace cards in Proposed Solutions.)
       - The section heading is Proposed Solutions; there is no Summation button or Summation label.
       - Clickable and selected hierarchy rows use a pointer cursor and visual selection state.
     v3.9 UI CHANGES:
       - Current Process Overview adds a concise Business Context card above the SAP Business Process Hierarchy Path.
       - The repeated text-only hierarchy path below the hierarchy nodes is removed.
       - Solutions Discovery removes the separate Type column.
       - Mapping Type is displayed as a smaller dark-purple sub-badge beneath Category, except for Whitespace.
       - The Solutions Discovery Name column is renamed Solution.
     v3.8 UI CHANGES:
       - Clicking an enabler in the Reimagined Process Flow step modal opens a dedicated detail modal.
       - Enabler detail modal includes Product, Persona, and Process KPIs tabs.
       - Product tab displays mapping details, challenge, value potential, benefits, and an Open Source link when available.
       - Persona tab displays the process role, role initials, and enabler-supported responsibilities.
       - Process KPIs tab displays literal source-provided mapping.kpis entries; qualitative process-impact ratings are not repeated as KPIs.
       - If no source-provided KPI exists, the Process KPIs tab displays a clear source-KPI empty-state message.
       - Source action label standardized to Open Source.
       - Overall Summary value-potential descriptions must be unique and dimension-specific.
     v3.7 UI CHANGES:
       - Current Situation displays the generated pain point for every task.
       - Only a pain point for a task with no qualified solution mapping is badged as Whitespace.
       - Current Situation CSV exports pain points for every task.
     v3.6 UI CHANGES:
       - Current Situation: removed Gateway Next Step; widened Pain Points.
       - Tab 2 renamed Solutions Discovery across Process Flow.
       - Category label CGS Scenarios is displayed as CGS Solution.
       - Tab 2 Gateway Next Step column removed.
       - Accenture Gen AI display is limited to mappings marked Demo.
       - Reimagined legend shows all categories and process symbols.
       - Reimagined task boxes use category-colored borders and synchronized labels.
     (BPH path header + zoomable swimlanes + clickable step modal)
     v3.5 CHANGE (UI only - the DATA CONTRACT is unchanged):
       - Tab 3 step pop-up: the "Agents" section is now titled
         "Enablers" (same content, same JSON keys).
     v3.4 CHANGES (UI only - the DATA CONTRACT is unchanged):
       - Tab 1: "Process Diagram" card replaced by the SAP Business
         Process Hierarchy path (last node highlighted in purple).
       - Tab 1: "Key Pain Points" card removed (step-level pain
         points remain in the Current Situation table).
       - Tab 1: "System" column removed from Current Situation (As-Is).
       - Tabs 1 & 3: gateway captions now wrap and show the FULL name
         (with tooltip) instead of being cut at 26 characters.
       - Tab 2: repeated Name values are counted once in the category
         counters; "Product / System" and "Source Reference" columns
         removed.
       - Tab 3: "AI Enablement" column removed from the Reimagined
         Business Process Elements table.
     The agent still emits the SAME JSON keys (system, pain_points,
     product, source_ref, ai_label); they are simply not rendered as
     separate columns, and are still used by search, tooltips, the
     step modal and the CSV exports where noted.
     RULES FOR THE AGENT:
     1. Copy this file BYTE-FOR-BYTE.
     2. Replace ONLY the REPORT_JSON token (window.__REIMAGINE_DATA__) with the
        generated JSON object (valid JSON, double quotes, not a
        string, no code fences).
     3. Replace the PROCESS_TITLE token with meta.process_name.
     4. NEVER edit CSS, HTML, class names or JavaScript.
     The swimlane diagrams are DRAWN BY THIS TEMPLATE from the
     logical model (lanes + elements + connections). The agent must
     NEVER output pixel coordinates, SVG or waypoints.

     ------------------- DATA CONTRACT -------------------
     The REPORT_JSON token must be replaced by a single JSON
     object with exactly these five top-level keys:

     meta {
       process_id, process_name, l1, l2, l3, industry, function,
       generated_on,                 // YYYY-MM-DD
       input_mode,                   // "image" | "bph"
       bph_path,                     // "L1 > L2 > L3 > L4 > L5"
       source_file_name,
       source_diagram_image          // data: URI of the uploaded
                                     // image, or null in bph mode
     }

     current_process_overview {
       process_summary: [str],       // 4-6 narrative sentences
       pain_points:     [str],       // exactly one per task, task order (Rules s2)
       steps: [{
         step_no, business_process_step, role, system, description,
         pain_points: [str],
         gateway_next_step: [{condition, next_step}]
       }],
       diagram {
         pool_name,
         lanes:    [{lane_id, lane_name}],
         elements: [{id, kind, label, lane_id, column, gateway_type}],
         connections: [{from, to, label}]
       }
     }
     // kind = "task" | "gateway" | "event-start" | "event-end"
     // gateway_type = "exclusive" | "parallel" | "inclusive"
     // column = 0-based left-to-right position in FLOW order: for every
     //          non-loop connection, target column > source column
     //          (v4.6 also normalizes this at render time)

     agentic_discovery {
       executive_summary: [str],
       business_process_table: [{
         step_no, business_process_step, role, gateway_next_step,
         mappings: [{
           category,      // CGS Scenarios | Accenture Gen AI |
                          // BPA Bots | SAP Business AI | Whitespace
           name, type, rationale, product, source_ref, link,
           challenge, value,
           benefits: [str],
           kpis: [{name}] // literal source-provided KPI or outcome entries only; use [] when none
         }]
       }]
     }

     reimagine_process_flow {
       business_process_table: [ ...same as above, plus per step:
         to_be,                      // one sentence, AI-enabled
         process_impact { cost, cycle_time, experience,
                          productivity, risk }
                          // each {qualitative_rating, description}
       ],
       diagram { ...same shape as the as-is diagram, identical ids,
                 plus on each element: role, ai_category, ai_label }
     }

     overall_summary {
       headline,
       category_split { "CGS Scenarios", "Accenture Gen AI",
                        "BPA Bots", "SAP Business AI",
                        "Whitespace" },   // percentages, sum = 100
       value_potential:  [{value_dimension, qualitative_rating,
                           description}], // descriptions must be unique and dimension-specific
       kpis_benchmarks:  [{kpi}], // retained property name; UI displays KPI names only
       personas_impacted:        [str],
       whitespace_opportunities: [str],
       recommendations:          [str]
     }
     -----------------------------------------------------
     ============================================================ -->

<head>
<meta charset="UTF-8"/>

<title>Reimagine Process Flow — Manage code date / lot code tracking and rotation</title>
<style>
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:#f7f7f9;color:#1c1c1c;font-family:Inter,Segoe UI,Roboto,-apple-system,sans-serif;font-size:13px}
a{color:inherit;text-decoration:none}
.rpf-shell{max-width:1680px;margin:0 auto;padding:0 20px 60px}
.rpf-hdr{background:linear-gradient(120deg,#a100ff 0%,#7500c0 55%,#460073 100%);color:#fff;padding:22px 26px;border-radius:0 0 14px 14px;margin:0 -20px 16px}
.rpf-hdr__eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;font-weight:600}
.rpf-hdr__title{font-size:23px;font-weight:700;margin:6px 0 4px}
.rpf-hdr__meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.rpf-hdr__pill{background:#ffffff26;border:1px solid #ffffff40;border-radius:20px;padding:3px 11px;font-size:11px;font-weight:500}
.rpf-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid #ececf1;margin-bottom:14px}
.rpf-tab{background:none;border:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;color:#6b6b76;padding:10px 16px;border-bottom:3px solid transparent;margin-bottom:-2px}
.rpf-tab:hover{color:#a100ff}
.rpf-tab--active{color:#a100ff;border-bottom-color:#a100ff}
.rpf-panel{display:none}.rpf-panel--active{display:block}
.rpf-card{background:#fff;border:1px solid #ececf1;border-radius:10px;padding:16px 18px;margin-bottom:12px}
.rpf-card-title{font-size:13px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.rpf-card-title:before{content:"";width:3px;height:14px;background:#a100ff;border-radius:2px;display:inline-block}
.rpf-sub{font-size:11px;color:#77777f;margin:-6px 0 10px}
.rpf-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.rpf-kpi{background:#fff;border:1px solid #ececf1;border-left:4px solid #a100ff;border-radius:10px;padding:13px 15px}
.rpf-kpi__val{font-size:25px;font-weight:800;color:#a100ff;line-height:1}
.rpf-kpi__lbl{font-size:11px;font-weight:600;color:#3c3c45;margin-top:5px}
.rpf-kpi__sub{font-size:10px;color:#8b8b95;margin-top:2px}
.rpf-legend{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.rpf-fchip{border:1px solid #dcdce4;background:#fff;border-radius:20px;padding:5px 13px;font-size:11px;font-weight:600;color:#55555f;cursor:pointer;font-family:inherit}
.rpf-fchip--on{background:#a100ff;border-color:#a100ff;color:#fff}
.cat{display:inline-block;border-radius:8px;padding:3px 9px;font-size:10px;font-weight:700;white-space:nowrap;font-family:IBM Plex Mono,Consolas,monospace}
.cat--cgs{background:#f3e6ff;border:1px solid #dda0ff;color:#7500c0}
.cat--gen{background:#e8f1ff;border:1px solid #bfdbfe;color:#1d4ed8}
.cat--bpa{background:#e9fbf3;border:1px solid #a7e8cd;color:#0d7a53}
.cat--sap{background:#fff4e8;border:1px solid #fed7aa;color:#c2410c}
.cat--ws{background:#fdf6e3;border:1px solid #f0d58a;color:#8a6100}
.badge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:600;background:#f2f2f6;border:1px solid #e2e2ea;color:#55555f;white-space:nowrap}
.chip{display:inline-block;background:#f3e6ff;border:1px solid #dda0ff;border-radius:16px;color:#7500c0;font-size:10.5px;font-weight:600;padding:3px 10px;max-width:230px;line-height:1.45;word-break:break-word}
.chip--ws{background:#fdf6e3;border-color:#f0d58a;color:#8a6100}
.rpf-tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.rpf-input{flex:1;min-width:200px;border:1px solid #dcdce4;border-radius:8px;padding:8px 12px;font-size:12px;font-family:inherit;outline:none}
.rpf-input:focus{border-color:#a100ff}

.rpf-btn--gh{background:#fff;color:#a100ff;border:1px solid #dda0ff}
.rpf-tblwrap{overflow-x:auto;border:1px solid #ececf1;border-radius:8px}

.rpf-tbl--wide{min-width:1180px}
.rpf-tbl thead tr{background:#a100ff}

.rpf-tbl tbody tr:nth-child(2n){background:#fafafc}
.rpf-tbl tbody tr:hover{background:#f9f0ff}
.rpf-tbl td.num{font-family:IBM Plex Mono,monospace;font-weight:700;color:#a100ff;text-align:center}
.rpf-rat{max-width:330px;font-size:11.5px;color:#4a4a55}
.rpf-src{font-family:IBM Plex Mono,monospace;font-size:10px;color:#8b8b95}
.rpf-link{color:#a100ff;font-weight:600;font-size:11px}
.rpf-empty{padding:26px;text-align:center;color:#9a9aa4;font-size:12px}

.rpf-foot{text-align:center;color:#9a9aa4;font-size:10.5px;padding:18px 0}

.rpf-prev{border:1px solid #ececf1;border-radius:8px;overflow:auto;background:#fcfcfd;padding:10px;text-align:center;max-height:600px}
.rpf-prev img,.rpf-prev svg{max-width:100%;height:auto}
/* ---- swimlane diagram ---- */
.dgrm{border:1px solid #ececf1;border-radius:8px;background:#fff;overflow:hidden}
.dgrm__bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:#faf6ff;border-bottom:1px solid #ececf1}

.dgrm__scroll{overflow:auto;max-height:640px;padding:6px;cursor:grab}

.dgrm__empty{padding:30px;text-align:center;color:#9a9aa4;font-size:12px}
/* ---- zoom toolbar ---- */
.dgrm__zoom{display:flex;align-items:center;gap:3px;margin-left:8px}
.dgrm__zbtn{background:#fff;border:1px solid #dda0ff;color:#7500c0;border-radius:6px;min-width:26px;height:24px;padding:0 7px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1}

  /* ================= SWIMLANE RENDERER =================

  var STRIP=34,COLW=200,ROWH=110,TW=140,TH=64,GW=44,EV=34,PADT=14;

    /* --- v4.6 flow-order column normalization ---

    (function(){

    var s='<defs><marker id="ah'+(opts.uid||"")+'" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#8d8d99"/></marker></defs>';

    /* ---------- v4.6 COLLISION-AWARE ORTHOGONAL ROUTER ----------

    var R=7,STUB=12,PAD=6,poolBot=PADT+y,bandTop=poolBot+14;

          if(col){var rev=(m[0]===l[0])?((l[1]-m[1])*(q[1]-l[1])<0):((l[0]-m[0])*(q[0]-l[0])<0);
            if(rev)bad=true;o[o.length-1]=q;continue;}}
        if(q[0]!==l[0]&&q[1]!==l[1])bad=true;
        o.push(q);}
      return{p:o,bad:bad};}
    function hit(s,r){return s.x2>r.x1&&s.x1<r.x2&&s.y2>r.y1&&s.y1<r.y2;}
    function cost(pts,c,pref,best){
      var sp=simp(pts);if(sp.bad)return{v:1e9};
      var p=sp.p,v=pref+(p.length-2)*25,i,j;
      for(i=0;i<p.length-1;i++)v+=(Math.abs(p[i+1][0]-p[i][0])+Math.abs(p[i+1][1]-p[i][1]))*0.04;
      if(v>best)return{v:v};
      var ss=[];for(i=0;i<p.length-1;i++)ss.push(mk(p[i],p[i+1]));
      var last=ss.length-1;
      for(i=0;i<ss.length;i++){var s=ss[i];
        if(s.x1<STRIP+2)v+=1e5;
        if(s.y1>poolBot)v+=150;
        for(j=0;j<OBS.length;j++){var o=OBS[j];
          if(!o.soft&&((i===0&&o.id===c.from)||(i===last&&o.id===c.to)))continue;
          if(o.soft&&((i===0&&o.id===c.from)||(i===last&&o.id===c.to)))continue;
          if(hit(s,o))v+=o.soft?4000:1e5;}
        for(j=0;j<LBL.length;j++)if(hit(s,LBL[j]))v+=3000;
        if(v>best)return{v:v};
        for(j=0;j<SEG.length;j++){var q=SEG[j];
          if(s.h===q.h){
            if(s.h){var dy=Math.abs(s.y1-q.y1),ov=Math.min(s.x2,q.x2)-Math.max(s.x1,q.x1);
              if(ov>1){if(dy<4)v+=3e4;else if(dy<9)v+=400;}}
            else{var dx=Math.abs(s.x1-q.x1),ov2=Math.min(s.y2,q.y2)-Math.max(s.y1,q.y1);
              if(ov2>1){if(dx<4)v+=3e4;else if(dx<9)v+=400;}}}
          else{var hs=s.h?s:q,vs=s.h?q:s;
            if(vs.x1>hs.x1&&vs.x1<hs.x2&&hs.y1>vs.y1&&hs.y1<vs.y2)v+=60;}}
        if(v>best)return{v:v};}
      return{v:v,p:p,ss:ss};}
    var DIR={r:[1,0],l:[-1,0],t:[0,-1],b:[0,1]};
    var SLOT={},FAN_LR=[0,10,-10,20,-20,26,-26],FAN_TB=[0,14,-14,28,-28,42,-42,56,-56];
    function portOf(bx,side){var n=SLOT[bx.el.id+side]||0,task=(bx.el.kind||"task")==="task",off=0;
      if(task)off=(side==="l"||side==="r")?FAN_LR[n%FAN_LR.length]:FAN_TB[n%FAN_TB.length];
      if(side==="r")return[bx.x+bx.w,bx.cy+off];
      if(side==="l")return[bx.x,bx.cy+off];
      if(side==="t")return[bx.cx+off,bx.y];
      return[bx.cx+off,bx.y+bx.h];}
    function near(list,v,n){return list.slice().sort(function(a,b){return Math.abs(a-v)-Math.abs(b-v);}).slice(0,n);}
    function route(c,A,B){
      var fwd=B.cx>A.cx+1,same=Math.abs(B.cx-A.cx)<=1,down=B.cy>A.cy;
      var SA=["r","b","t","l"],SB=["l","t","b","r"],combos=[];
      SA.forEach(function(a){SB.forEach(function(b){var pr=0;
        if(fwd){if(a!=="r")pr+=40;if(b!=="l")pr+=40;}
        else if(same){if(a!==(down?"b":"t")&&a!=="r")pr+=40;if(b!==(down?"t":"b")&&b!=="r")pr+=40;}
        else{if(a!=="r"&&a!=="b")pr+=30;if(b!=="l"&&b!=="b")pr+=30;}
        combos.push({a:a,b:b,pr:pr});});});
      var best={v:1e12},scored=[];
      combos.forEach(function(cm){
        var S=portOf(A,cm.a),E=portOf(B,cm.b),dS=DIR[cm.a],dE=DIR[cm.b];
        var S1=[S[0]+dS[0]*STUB,S[1]+dS[1]*STUB],E1=[E[0]+dE[0]*STUB,E[1]+dE[1]*STUB];
        var mids=[[],[[S1[0],E1[1]]],[[E1[0],S1[1]]]];
        XS.forEach(function(gx){mids.push([[gx,S1[1]],[gx,E1[1]]]);});
        YS.forEach(function(gy){mids.push([[S1[0],gy],[E1[0],gy]]);});
        var lb={v:1e12};
        mids.forEach(function(m){var r=cost([S,S1].concat(m,[E1,E]),c,cm.pr,best.v);
          if(r.p&&r.v<best.v){best=r;best.cm=cm;}if(r.v<lb.v)lb=r;});
        scored.push({cm:cm,S:S,E:E,S1:S1,E1:E1,v:lb.v});});
      if(best.v>=1e4){               /* stage 2: 5-leg detours on the 4 best port pairs */
        scored.sort(function(a,b){return a.v-b.v;});
        scored.slice(0,4).forEach(function(z){
          var gx1=near(XS,z.S1[0],14),gx2=near(XS,z.E1[0],14);
          var yr=YS.filter(function(gy){return gy>Math.min(z.S1[1],z.E1[1])-160&&gy<Math.max(z.S1[1],z.E1[1])+160||gy>poolBot;});
          gx1.forEach(function(a){gx2.forEach(function(b){yr.forEach(function(gy){
            var r=cost([z.S,z.S1,[a,z.S1[1]],[a,gy],[b,gy],[b,z.E1[1]],z.E1,z.E],c,z.cm.pr+60,best.v);
            if(r.p&&r.v<best.v){best=r;best.cm=z.cm;}});});});
          var gy1=near(YS,z.S1[1],6),gy2=near(YS,z.E1[1],6);
          gy1.forEach(function(a){gy2.forEach(function(b){XS.forEach(function(gx){
            var r=cost([z.S,z.S1,[z.S1[0],a],[gx,a],[gx,b],[z.E1[0],b],z.E1,z.E],c,z.cm.pr+60,best.v);
            if(r.p&&r.v<best.v){best=r;best.cm=z.cm;}});});});});}
      if(!best.p){var S0=portOf(A,"r"),E0=portOf(B,"l");best={p:[S0,[S0[0]+STUB,S0[1]],[S0[0]+STUB,E0[1]],E0],cm:{a:"r",b:"l"}};
        best.ss=[];for(var q=0;q<best.p.length-1;q++)best.ss.push(mk(best.p[q],best.p[q+1]));}
      SLOT[A.el.id+best.cm.a]=(SLOT[A.el.id+best.cm.a]||0)+1;
      SLOT[B.el.id+best.cm.b]=(SLOT[B.el.id+best.cm.b]||0)+1;
      return best;}
    /* path builder with rounded corners from a list of points */
    function poly(pts){
      var o="M"+pts[0][0]+","+pts[0][1];
      for(var i=1;i<pts.length-1;i++){
        var pv=pts[i-1],cu=pts[i],nx=pts[i+1];
        var d1x=Math.sign(cu[0]-pv[0]),d1y=Math.sign(cu[1]-pv[1]);
        var d2x=Math.sign(nx[0]-cu[0]),d2y=Math.sign(nx[1]-cu[1]);
        var r=Math.min(R,Math.abs(cu[0]-pv[0])/2||R,Math.abs(cu[1]-pv[1])/2||R,

        if(!r||(d1x===d2x&&d1y===d2y)){o+=" L"+cu[0]+","+cu[1];continue;}
        o+=" L"+(cu[0]-d1x*r)+","+(cu[1]-d1y*r)+
           " Q"+cu[0]+","+cu[1]+" "+(cu[0]+d2x*r)+","+(cu[1]+d2y*r);}
      var l=pts[pts.length-1];return o+" L"+l[0]+","+l[1];}
    /* place a connector label on a free stretch of its own route */
    function labelAt(c,p,fromGw){var w=String(c.label).length*5+8,ss=[],i;
      for(i=0;i<p.length-1;i++)ss.push({a:p[i],b:p[i+1],len:Math.abs(p[i+1][0]-p[i][0])+Math.abs(p[i+1][1]-p[i][1])});
      var pick=null;
      if(fromGw){for(i=0;i<ss.length;i++)if(ss[i].len>=24&&i>0){pick=ss[i];break;}}
      if(!pick)ss.forEach(function(s){if(!pick||s.len>pick.len)pick=s;});
      var hz=pick.a[1]===pick.b[1],lx,ly,anc,rc;
      if(hz){lx=(pick.a[0]+pick.b[0])/2;ly=pick.a[1]-4;anc="middle";rc={x1:lx-w/2,y1:ly-9,x2:lx+w/2,y2:ly+2};}
      else{lx=pick.a[0]+5;ly=(pick.a[1]+pick.b[1])/2+3;anc="start";rc={x1:lx,y1:ly-9,x2:lx+w,y2:ly+2};}
      LBL.push(rc);return{x:lx,y:ly,anc:anc};}
    var RKEY=JSON.stringify([lanes.map(function(l){return l.lane_id;}),
      els.map(function(x){return[x.id,x.kind,x.lane_id,x.column,x.label];}),
      cons.map(function(c){return[c.from,c.to,c.label||""];})]);
    var cached=ROUTE_CACHE[RKEY];
    /* short, simple hops first so they claim the direct channels */
    var order=cons.map(function(c,i){var A=box[c.from],B=box[c.to],d=1e9;
      if(A&&B)d=Math.abs(B.cx-A.cx)+Math.abs(B.cy-A.cy)+(B.cx<A.cx-1?4000:0)+(A===B?9000:0);
      return{c:c,i:i,d:d};}).sort(function(a,b){return a.d-b.d||a.i-b.i;});
    var drawn=cached||[];
    if(!cached){order.forEach(function(o){var c=o.c,A=box[c.from],B=box[c.to];if(!A||!B)return;
      var pts;
      if(A===B){var t=portOf(A,"t"),rr=portOf(A,"r");
        pts=[[t[0],t[1]],[t[0],t[1]-20],[rr[0]+26,t[1]-20],[rr[0]+26,rr[1]],[rr[0],rr[1]]];}
      else pts=route(c,A,B).p;
      for(var q=0;q<pts.length-1;q++){var sg=mk(pts[q],pts[q+1]);sg.from=c.from;sg.to=c.to;SEG.push(sg);}
      var lab=c.label?labelAt(c,pts,(A.el.kind==="gateway")):null;
      drawn.push({c:c,p:pts,lab:lab});});
      ROUTE_CACHE[RKEY]=drawn;}
    drawn.forEach(function(dw){
      dw.p.forEach(function(pt){if(pt[0]+20>maxX)maxX=pt[0]+20;if(pt[1]+16>maxY)maxY=pt[1]+16;});
      s+='<path class="sw-flow" d="'+poly(dw.p)+'" marker-end="url(#ah'+(opts.uid||"")+')"/>';
      if(dw.lab)s+='<text class="sw-lbl" x="'+dw.lab.x+'" y="'+dw.lab.y+'" text-anchor="'+dw.lab.anc+'">'+e(dw.c.label)+'</text>';});
    H=Math.max(H,maxY);
    function wrap(t,n,ml){t=String(t||"").trim();ml=ml||3;
      var w=t.split(/\s+/),o=[],c="";
      w.forEach(function(x){
        while(x.length>n){if(c){o.push(c);c="";}o.push(x.slice(0,n-1)+"\u2010");x=x.slice(n-1);}
        if((c+" "+x).trim().length>n){if(c)o.push(c);c=x;}else c=(c?c+" ":"")+x;});
      if(c)o.push(c);
      if(o.length>ml){o=o.slice(0,ml);o[ml-1]=o[ml-1].slice(0,Math.max(1,n-1))+"\u2026";}
      return o;}
    els.forEach(function(x){var b=box[x.id],k=x.kind||"task";
      if(k==="gateway"){
        s+='<path class="sw-gw" d="M'+b.cx+','+b.y+' L'+(b.x+b.w)+','+b.cy+' L'+b.cx+','+(b.y+b.h)+' L'+b.x+','+b.cy+' z"/>';
        s+='<text class="sw-txt" x="'+b.cx+'" y="'+(b.cy+3.5)+'" text-anchor="middle" style="font-size:12px;fill:#c2410c">'+(x.gateway_type==="parallel"?"+":x.gateway_type==="inclusive"?"O":"X")+'</text>';
        if(x.label)wrap(x.label,26,3).forEach(function(t,i){
          s+='<text class="sw-cap" x="'+b.cx+'" y="'+(b.y+b.h+11+i*10)+'" text-anchor="middle"><title>'+e(x.label)+'</title>'+e(t)+'</text>';});}
      else if(k==="event-start"||k==="event-end"){
        s+='<circle class="sw-ev'+(k==="event-end"?" sw-ev--end":"")+'" cx="'+b.cx+'" cy="'+b.cy+'" r="'+(b.w/2)+'"/>';
        wrap(x.label,18,3).forEach(function(t,i){s+='<text class="sw-cap" x="'+b.cx+'" y="'+(b.y+b.h+11+i*10)+'" text-anchor="middle"><title>'+e(x.label)+'</title>'+e(t)+'</text>';});}
      else{
        var cl=x.ai_category?(x.ai_category==="Whitespace"?"sw-task--ws":"sw-task--ai"):"";
        var hit=opts.click?'<g class="sw-node" data-node="'+e(x.id)+'">':"";
        s+=hit;
        var boxCol=x.ai_category?(BAR[x.ai_category]||"#7C00D4"):"#8d8d99",boxFill=x.ai_category==="Whitespace"?"#fffbee":"#ffffff";
        s+='<rect class="sw-task '+cl+'" x="'+b.x+'" y="'+b.y+'" width="'+b.w+'" height="'+b.h+'" rx="7" fill="'+boxFill+'" stroke="'+boxCol+'" style="stroke-width:'+(x.ai_category==="Whitespace"?"1.6":"1.9")+'px"/>';
        var ls=wrap(x.label,20),y0=b.cy-(ls.length-1)*5.5-(x.ai_category?5:0);
        ls.forEach(function(t,i){s+='<text class="sw-txt" x="'+b.cx+'" y="'+(y0+i*11+3)+'" text-anchor="middle">'+e(t)+'</text>';});
        if(x.ai_category){var col=BAR[x.ai_category]||"#7C00D4";
          s+='<rect x="'+(b.x+5)+'" y="'+(b.y+b.h-16)+'" width="'+(b.w-10)+'" height="12" rx="6" fill="'+col+'" opacity="0.13"/>';
          s+='<text class="sw-ann" x="'+b.cx+'" y="'+(b.y+b.h-6.5)+'" text-anchor="middle" fill="'+col+'">'+e(String(x.ai_label||x.ai_category).slice(0,28))+'</text>';}
        if(opts.click){
          s+='<circle cx="'+(b.x+b.w-11)+'" cy="'+(b.y+10)+'" r="6" fill="#7C00D4" opacity=".12"/>';
          s+='<text class="sw-badge-i" x="'+(b.x+b.w-11)+'" y="'+(b.y+13)+'" text-anchor="middle">i</text>';
          s+='<rect class="sw-hot" x="'+b.x+'" y="'+b.y+'" width="'+b.w+'" height="'+b.h+'" rx="7"/></g>';}}});
    s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" preserveAspectRatio="xMinYMin meet" xmlns="http://www.w3.org/2000/svg">'+s;
    var lg=opts.legend?'<div class="dgrm__lg">'+opts.legend+'</div>':'';
    var uid=opts.uid||"d";
    var zm='<div class="dgrm__zoom">'+
      '<button type="button" class="dgrm__zbtn" data-z="out" title="Zoom out">&minus;</button>'+
      '<span class="dgrm__zlvl" id="zl_'+uid+'">100%</span>'+
      '<button type="button" class="dgrm__zbtn" data-z="in" title="Zoom in">+</button>'+
      '<button type="button" class="dgrm__zbtn dgrm__zbtn--wide" data-z="fit" title="Fit to width">Fit</button>'+
      '<button type="button" class="dgrm__zbtn dgrm__zbtn--wide" data-z="reset" title="Actual size">100%</button>'+

  /* ================= ZOOM / PAN BINDING =================
     Registry keeps one controller per diagram so a tab that was
     hidden at bind time (clientWidth 0) can be re-fitted the moment
     it becomes visible. Without this the To-Be flow opened at 100%. */
  var ZOOM={};
  function bindZoom(uid){
    var box=document.getElementById("dg_"+uid);if(!box)return;
    var scroll=box.querySelector(".dgrm__scroll"),svg=box.querySelector("svg"),
        lvl=box.querySelector(".dgrm__zlvl");
    if(!scroll||!svg)return;
    var W=+box.getAttribute("data-w")||1,H=+box.getAttribute("data-h")||1,z=1,fitted=false;
    function apply(){
      z=Math.max(.2,Math.min(4,z));
      svg.setAttribute("width",Math.round(W*z));svg.setAttribute("height",Math.round(H*z));
      if(lvl)lvl.textContent=Math.round(z*100)+"%";}
    var lastFitW=0;
    function avail(){
      /* real width when visible; estimate from an ancestor while hidden */
      var w=scroll.clientWidth,est=false;
      if(w<40){est=true;var n=box;while(n&&n!==document.body){if(n.offsetWidth>40){w=n.offsetWidth;break;}n=n.parentNode;}}
      if(w<40)w=(document.querySelector(".rpf-shell")||{}).clientWidth||1200;
      return{w:w-26,est:est};}
    function fit(){var a=avail();if(a.w>60){z=Math.min(1,a.w/W);apply();fitted=true;lastFitW=a.est?0:a.w;}}
    function zoomAt(f,cx,cy){
      var oz=z;z=Math.max(.2,Math.min(4,z*f));if(z===oz)return;
      var rx=(scroll.scrollLeft+cx)/oz,ry=(scroll.scrollTop+cy)/oz;
      apply();scroll.scrollLeft=rx*z-cx;scroll.scrollTop=ry*z-cy;}
    [].forEach.call(box.querySelectorAll("[data-z]"),function(b){
      b.onclick=function(ev){ev.stopPropagation();
        var a=b.getAttribute("data-z"),r=scroll.getBoundingClientRect();
        if(a==="in")zoomAt(1.25,r.width/2,r.height/2);
        else if(a==="out")zoomAt(.8,r.width/2,r.height/2);
        else if(a==="reset"){z=1;apply();}
        else if(a==="fit")fit();
        else if(a==="full"){
          if(document.fullscreenElement)document.exitFullscreen();
          else if(box.requestFullscreen)box.requestFullscreen();}};});
    /* ctrl/cmd + wheel zooms toward the pointer; plain wheel scrolls */
    scroll.addEventListener("wheel",function(ev){
      if(!ev.ctrlKey&&!ev.metaKey)return;ev.preventDefault();
      var r=scroll.getBoundingClientRect();
      zoomAt(ev.deltaY<0?1.12:.89,ev.clientX-r.left,ev.clientY-r.top);},{passive:false});
    /* drag to pan (ignored when the press starts on a clickable node) */
    var pan=false,px=0,py=0,sl=0,st=0,moved=0;
    scroll.addEventListener("mousedown",function(ev){
      if(ev.button!==0)return;
      if(ev.target.closest&&ev.target.closest(".sw-node"))return;
      pan=true;moved=0;px=ev.clientX;py=ev.clientY;sl=scroll.scrollLeft;st=scroll.scrollTop;
      scroll.className="dgrm__scroll is-pan";ev.preventDefault();});
    document.addEventListener("mousemove",function(ev){
      if(!pan)return;var dx=ev.clientX-px,dy=ev.clientY-py;
      moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
      scroll.scrollLeft=sl-dx;scroll.scrollTop=st-dy;});
    document.addEventListener("mouseup",function(){
      if(pan){pan=false;scroll.className="dgrm__scroll";}});
    document.addEventListener("fullscreenchange",function(){
      if(document.fullscreenElement===box)setTimeout(fit,60);});
    /* re-fit when the true width differs from the one fit last used
       (panel was hidden, window resized, fullscreen toggled) */
    ZOOM[uid]={fit:fit,apply:apply,
      refit:function(){var a=avail();
        if(a.est||a.w<60)return;
        if(!fitted||Math.abs(a.w-lastFitW)>2)fit();}};
    window.addEventListener("resize",function(){if(fitted)fit();});
    fit();
    return ZOOM[uid];
  }
  function refitAll(){for(var k in ZOOM){if(ZOOM[k])ZOOM[k].refit();}}

  /* ================= STEP DETAIL MODAL ================= */
  function impactCards(pi){
    var ORD=[["productivity","Productivity"],["cycle_time","Cycle Time"],["cost","Cost"],["risk","Risk"],["experience","Experience"]];
    var any=false,g="";
    ORD.forEach(function(o,i){
      var v=pi?pi[o[0]]:null;if(!v)return;any=true;
      var rt=(typeof v==="object"?v.qualitative_rating:v)||"—",
          ds=(typeof v==="object"?v.description:"")||"",
          r=String(rt).toLowerCase(),
          c=r.indexOf("high")>-1?"smod__ip--high":r.indexOf("med")>-1?"smod__ip--med":"smod__ip--low";
      g+='<div class="smod__ic"><div class="smod__il">'+e(o[1])+'</div>'+
         '<span class="smod__ip '+c+'">'+e(rt)+'</span>'+
         (ds?'<button type="button" class="smod__why" data-w="'+i+'">&#9662; why</button><div class="smod__wtx" id="wtx'+i+'">'+e(ds)+'</div>':'')+
         '</div>';});
    return any?'<div class="smod__sec">Impact of AI on this step</div><div class="smod__impact"><div class="smod__grid">'+g+'</div></div>':"";
  }
  function openStep(row){
    if(!row)return;
    var ms=visibleMappings(row).filter(function(m){return m&&m.name&&m.name!=="—";});
    var h='<div class="smod" id="smod"><div class="smod__box">'+
      '<div class="smod__hd"><div class="smod__ttl">'+e(row.business_process_step||"Step")+
